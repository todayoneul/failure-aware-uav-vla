# Phase 2 environment (CARLA car following), managed by uv.
# Phase 1 (landing VLA) keeps its own environments, recorded in ../landing_vla/docs/setup.md.
[project]
name = "drone-car-follow"
version = "0.1.0"
description = "A drone that finds a car named in natural language, locks on and follows it at a set distance, in CARLA."
readme = "README.md"
# carla 0.9.16 ships wheels for CPython 3.10-3.12 only.
requires-python = ">=3.12,<3.13"
dependencies = [
    # The client must match the simulator release (CARLA_0.9.16).
    "carla==0.9.16",
    "numpy>=2",
    "opencv-python>=4.11",
    "pillow>=11",
    # Step 5 detector (docs/demo1.md 5): PyTorch built for CUDA 12.8 (the RTX 50 series needs 12.8 or later)
    # and RF-DETR (Apache-2.0), chosen over AGPL detectors with a real drone in mind.
    "torch>=2.7",
    "torchvision>=0.22",
    "rfdetr==1.12.1",
]

[tool.uv]
package = false
required-version = ">=0.13"
# carla has wheels only for Windows x64 and Linux x64 (WSL).
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# PyTorch with CUDA 12.8 from the PyTorch index; everything else from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
